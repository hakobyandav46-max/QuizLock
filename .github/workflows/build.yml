name: Build QuizLock

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find and Publish Project
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          if (-not $proj) {
              Write-Error "No .csproj file found in repository!"
              exit 1
          }
          Write-Host "Found project: $($proj.FullName)"
          dotnet publish "$($proj.FullName)" -c Release -o ./publish /p:HasPackageAndPublishMenu=false

      - name: Upload built app artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizLock-app
          path: ./publish/
